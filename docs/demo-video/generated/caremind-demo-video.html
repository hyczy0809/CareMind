<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CareMind Demo Video</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #18130f;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
    }
    canvas {
      width: min(100vw, 177.78vh);
      height: auto;
      aspect-ratio: 16 / 9;
      display: block;
      background: #faf5ec;
    }
  </style>
</head>
<body>
  <canvas id="video" width="1920" height="1080"></canvas>
  <script>
    const canvas = document.getElementById("video");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;
    const DURATION_MS = 53000;
    const palette = {
      paper: "#FAF5EC",
      wash: "#F2ECE2",
      card: "#FFFDF8",
      ink: "#2B241D",
      secondary: "#655A4F",
      muted: "#8A7F73",
      green: "#238663",
      greenDark: "#245847",
      greenSoft: "#E8F3E8",
      clay: "#D98253",
      claySoft: "#FFF1E5",
      amber: "#B56A18",
      amberSoft: "#FFF5DC",
      red: "#C8503B",
      redSoft: "#FFF0EA",
      blue: "#476F92",
      blueSoft: "#EAF1F6",
      border: "#E7DCCF"
    };

    const scenes = [
      { id: "premise", start: 0, end: 5 },
      { id: "input", start: 5, end: 13 },
      { id: "agent", start: 13, end: 21 },
      { id: "privacy", start: 21, end: 28 },
      { id: "today", start: 28, end: 36 },
      { id: "script", start: 36, end: 43 },
      { id: "followup", start: 43, end: 49 },
      { id: "outro", start: 49, end: 53 }
    ];

    function clamp(v, a = 0, b = 1) { return Math.max(a, Math.min(b, v)); }
    function ease(v) { v = clamp(v); return 1 - Math.pow(1 - v, 3); }
    function sceneProgress(sec, scene) { return clamp((sec - scene.start) / (scene.end - scene.start)); }
    function activeScene(sec) { return scenes.find(s => sec >= s.start && sec < s.end) || scenes[scenes.length - 1]; }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function fillRound(x, y, w, h, r, color) {
      roundRect(x, y, w, h, r);
      ctx.fillStyle = color;
      ctx.fill();
    }

    function strokeRound(x, y, w, h, r, color, width = 2) {
      roundRect(x, y, w, h, r);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.stroke();
    }

    function text(str, x, y, opts = {}) {
      const size = opts.size || 40;
      const weight = opts.weight || 500;
      const color = opts.color || palette.ink;
      const align = opts.align || "left";
      ctx.save();
      ctx.globalAlpha = opts.alpha == null ? 1 : opts.alpha;
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.textBaseline = "top";
      ctx.font = `${weight} ${size}px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif`;
      ctx.fillText(str, x, y);
      ctx.restore();
    }

    function wrap(str, x, y, maxWidth, lineHeight, opts = {}) {
      const chars = Array.from(str);
      let line = "";
      let cy = y;
      ctx.save();
      ctx.font = `${opts.weight || 400} ${opts.size || 34}px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif`;
      ctx.fillStyle = opts.color || palette.secondary;
      ctx.textBaseline = "top";
      ctx.globalAlpha = opts.alpha == null ? 1 : opts.alpha;
      for (const ch of chars) {
        const test = line + ch;
        if (ctx.measureText(test).width > maxWidth && line) {
          ctx.fillText(line, x, cy);
          line = ch;
          cy += lineHeight;
        } else {
          line = test;
        }
      }
      if (line) ctx.fillText(line, x, cy);
      ctx.restore();
      return cy + lineHeight;
    }

    function background(sec) {
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, palette.paper);
      g.addColorStop(1, palette.wash);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      const pulse = Math.sin(sec * 0.4) * 0.5 + 0.5;
      const rg = ctx.createRadialGradient(1520, 190, 10, 1520, 190, 760);
      rg.addColorStop(0, `rgba(35,134,99,${0.16 + pulse * 0.04})`);
      rg.addColorStop(1, "rgba(35,134,99,0)");
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, W, H);
      const cg = ctx.createRadialGradient(170, 880, 10, 170, 880, 680);
      cg.addColorStop(0, "rgba(217,130,83,0.16)");
      cg.addColorStop(1, "rgba(217,130,83,0)");
      ctx.fillStyle = cg;
      ctx.fillRect(0, 0, W, H);
    }

    function logo(x, y, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      fillRound(0, 0, 56 * scale, 56 * scale, 18 * scale, palette.greenSoft);
      strokeRound(0, 0, 56 * scale, 56 * scale, 18 * scale, "#CFE4D2", 2 * scale);
      ctx.strokeStyle = palette.greenDark;
      ctx.lineWidth = 4 * scale;
      ctx.beginPath();
      ctx.arc(22 * scale, 24 * scale, 8 * scale, Math.PI, Math.PI * 2);
      ctx.arc(34 * scale, 24 * scale, 8 * scale, Math.PI, Math.PI * 2);
      ctx.moveTo(14 * scale, 25 * scale);
      ctx.bezierCurveTo(16 * scale, 43 * scale, 39 * scale, 44 * scale, 42 * scale, 25 * scale);
      ctx.stroke();
      ctx.restore();
    }

    function pill(label, x, y, color, bg, width) {
      const w = width || Math.max(120, label.length * 28 + 32);
      fillRound(x, y, w, 48, 24, bg);
      text(label, x + w / 2, y + 12, { size: 22, weight: 700, color, align: "center" });
      return w;
    }

    function phoneBase(x, y, scale = 1) {
      const w = 470 * scale, h = 860 * scale, r = 58 * scale;
      ctx.save();
      ctx.shadowColor = "rgba(88,60,38,0.24)";
      ctx.shadowBlur = 42 * scale;
      ctx.shadowOffsetY = 20 * scale;
      fillRound(x, y, w, h, r, "#fbfaf6");
      ctx.shadowColor = "transparent";
      strokeRound(x, y, w, h, r, "#DED2C5", 2 * scale);
      fillRound(x + 22 * scale, y + 22 * scale, w - 44 * scale, h - 44 * scale, 42 * scale, "#FAF5EC");
      text("9:41", x + 56 * scale, y + 48 * scale, { size: 24 * scale, weight: 800 });
      return { x: x + 42 * scale, y: y + 100 * scale, w: w - 84 * scale, h: h - 150 * scale, scale };
    }

    function drawCard(x, y, w, h, tone = "plain") {
      const bg = tone === "green" ? palette.greenSoft : tone === "amber" ? palette.amberSoft : tone === "red" ? palette.redSoft : palette.card;
      fillRound(x, y, w, h, 24, bg);
      strokeRound(x, y, w, h, 24, tone === "plain" ? palette.border : "rgba(80,70,58,0.12)", 2);
    }

    function inputPhone(progress) {
      const p = phoneBase(1200, 105, 0.88);
      text("智能记录", p.x, p.y, { size: 30, weight: 800 });
      drawCard(p.x, p.y + 58, p.w, 250, "green");
      text("今天妈妈有什么让你担心的事吗？", p.x + 24, p.y + 88, { size: 22, weight: 700, color: palette.greenDark });
      const note = "妈妈昨晚起来四次，今天一直说有人偷她的钱，晚饭只吃了几口。我也快撑不住了。";
      const shown = note.slice(0, Math.floor(note.length * ease(progress)));
      wrap(shown, p.x + 24, p.y + 130, p.w - 48, 34, { size: 22, color: palette.ink });
      pill("按住说话", p.x + 24, p.y + 330, palette.secondary, "rgba(255,253,248,0.82)", 140);
      pill("帮我整理", p.x + p.w - 170, p.y + 330, "#fff", palette.green, 146);
      return p;
    }

    function agentPhone(progress) {
      const p = phoneBase(1200, 105, 0.88);
      text("CareMind Agent", p.x, p.y, { size: 30, weight: 800 });
      drawCard(p.x, p.y + 58, p.w, 380, "green");
      const steps = ["整理今天发生的事", "找出值得留意的地方", "生成沟通建议", "记住有用的照护方式"];
      steps.forEach((s, i) => {
        const done = progress > (i + 1) / 5;
        fillRound(p.x + 28, p.y + 105 + i * 72, 32, 32, 16, done ? palette.green : "#D8CABD");
        if (done) text("✓", p.x + 35, p.y + 103 + i * 72, { size: 26, weight: 800, color: "#fff" });
        text(s, p.x + 78, p.y + 102 + i * 72, { size: 24, weight: 700, color: done ? palette.greenDark : palette.secondary });
      });
      return p;
    }

    function privacyPhone(progress) {
      const p = phoneBase(1200, 105, 0.88);
      text("隐私模式", p.x, p.y, { size: 30, weight: 800 });
      drawCard(p.x, p.y + 58, p.w, 170, "green");
      text("敏感记录优先留在本机", p.x + 24, p.y + 88, { size: 24, weight: 800, color: palette.greenDark });
      wrap("家属可选择端侧模型处理更私密的照护内容。", p.x + 24, p.y + 132, p.w - 48, 30, { size: 20, color: palette.secondary });

      drawCard(p.x, p.y + 255, p.w, 245, "plain");
      text("Gemma 端侧模型", p.x + 24, p.y + 288, { size: 25, weight: 800 });
      const barW = p.w - 48;
      fillRound(p.x + 24, p.y + 340, barW, 18, 9, "#E8DED2");
      fillRound(p.x + 24, p.y + 340, barW * (0.35 + ease(progress) * 0.65), 18, 9, palette.green);
      text("下载后用于本地照护理解与建议生成", p.x + 24, p.y + 382, { size: 20, color: palette.secondary });
      pill("Gemma · on-device", p.x + 24, p.y + 430, palette.greenDark, palette.greenSoft, 220);

      drawCard(p.x, p.y + 532, p.w, 115, "amber");
      wrap("语音输入当前通过系统语音识别转为可编辑文本。", p.x + 24, p.y + 563, p.w - 48, 30, { size: 19, color: palette.amber, weight: 700 });
      return p;
    }

    function todayPhone(progress) {
      const p = phoneBase(1200, 105, 0.88);
      text("今日照护", p.x, p.y, { size: 30, weight: 800 });
      drawCard(p.x, p.y + 58, p.w, 150, "green");
      text("今日陪伴", p.x + 24, p.y + 86, { size: 24, weight: 800, color: palette.greenDark });
      text("老照片回忆 · 5 分钟", p.x + 24, p.y + 126, { size: 24, weight: 700 });
      drawCard(p.x, p.y + 230, p.w, 290, "amber");
      text("今天值得关注", p.x + 24, p.y + 258, { size: 24, weight: 800, color: palette.amber });
      text("夜间安全风险", p.x + 24, p.y + 300, { size: 28, weight: 800 });
      wrap("触发依据：昨夜起床 4 次，可能增加跌倒或开门外出风险。", p.x + 24, p.y + 350, p.w - 48, 32, { size: 20 });
      const y = p.y + 430;
      fillRound(p.x + 24, y, 34, 34, 10, progress > 0.65 ? palette.green : "transparent");
      strokeRound(p.x + 24, y, 34, 34, 10, palette.green, 2);
      text("打开走廊夜灯", p.x + 72, y + 3, { size: 22, weight: 700 });
      return p;
    }

    function scriptPhone() {
      const p = phoneBase(1200, 105, 0.88);
      text("沟通建议", p.x, p.y, { size: 30, weight: 800 });
      drawCard(p.x, p.y + 58, p.w, 230, "red");
      text("不建议说", p.x + 24, p.y + 88, { size: 22, weight: 800, color: palette.red });
      wrap("“没人偷，你别乱想。”", p.x + 24, p.y + 135, p.w - 48, 38, { size: 27, weight: 700, color: palette.ink });
      drawCard(p.x, p.y + 320, p.w, 270, "green");
      text("可以试着说", p.x + 24, p.y + 350, { size: 22, weight: 800, color: palette.greenDark });
      wrap("“你是不是很担心？我陪你一起找找。”", p.x + 24, p.y + 398, p.w - 48, 38, { size: 27, weight: 700, color: palette.ink });
      pill("播放这句话", p.x + 24, p.y + 500, "#fff", palette.green, 160);
      return p;
    }

    function followupPhone() {
      const p = phoneBase(1200, 105, 0.88);
      text("复诊准备", p.x, p.y, { size: 30, weight: 800 });
      drawCard(p.x, p.y + 58, p.w, 330, "plain");
      text("家属照护记录", p.x + 24, p.y + 88, { size: 26, weight: 800 });
      text("近 7 天 · 不包含医生诊断", p.x + 24, p.y + 126, { size: 18, color: palette.muted });
      wrap("一、核心变化\n- 夜间起床明显增加\n- 被害感表达 3 次\n- 晚餐摄入减少", p.x + 24, p.y + 170, p.w - 48, 31, { size: 21 });
      drawCard(p.x, p.y + 420, p.w, 160, "green");
      text("建议复诊时问医生", p.x + 24, p.y + 448, { size: 23, weight: 800, color: palette.greenDark });
      wrap("夜间起床和被害感表达是否需要进一步评估？", p.x + 24, p.y + 492, p.w - 48, 30, { size: 20 });
      pill("生成可复制摘要", p.x + 24, p.y + 620, "#fff", palette.green, 230);
      return p;
    }

    function leftNarrative(title, body, sec, opts = {}) {
      const alpha = opts.alpha == null ? 1 : opts.alpha;
      logo(145, 116, 1.05);
      text("CareMind", 220, 129, { size: 31, weight: 800, color: palette.greenDark, alpha });
      pill(opts.kicker || "家庭照护导航 Agent", 145, 205, palette.clay, palette.claySoft, 270);
      wrap(title, 145, 292, 850, 84, { size: opts.titleSize || 66, weight: 800, color: palette.ink, alpha });
      wrap(body, 150, 520, 780, 48, { size: opts.bodySize || 30, color: opts.bodyColor || palette.secondary, alpha });
      text("不诊断 · 不处方 · 不替代医生", 150, 900, { size: 23, weight: 700, color: opts.boundaryColor || palette.secondary, alpha });
    }

    function drawIntro(sec, progress) {
      const a = ease(progress);
      leftNarrative("照顾失智的妈妈，已经两年了。", "CareMind 面向失智症家庭照护者，帮家属把混乱的照护过程变成可记录、可追踪、可沟通的支持。", sec, { alpha: a, titleSize: 60, kicker: "面向家庭照护者", bodyColor: palette.ink, boundaryColor: palette.secondary });
      const p = phoneBase(1210, 120, 0.82);
      text("今天", p.x, p.y, { size: 30, weight: 800 });
      drawCard(p.x, p.y + 70, p.w, 160, "amber");
      text("昨晚起床 4 次", p.x + 24, p.y + 104, { size: 26, weight: 800 });
      text("晚饭只吃几口", p.x + 24, p.y + 154, { size: 24, color: palette.secondary });
      drawCard(p.x, p.y + 255, p.w, 150, "red");
      text("我也快撑不住了", p.x + 24, p.y + 298, { size: 26, weight: 800 });
    }

    function drawInput(sec, progress) {
      leftNarrative("一句话，说出今天。", "不需要整理格式，不需要想分类。把最放心不下的事写下来，剩下交给 CareMind。", sec, { titleSize: 66, kicker: "智能记录" });
      inputPhone(progress);
    }

    function drawAgent(sec, progress) {
      leftNarrative("AI 把碎片变成照护线索。", "结构化睡眠、行为、饮食、安全和照护者压力，同时保留原文证据。", sec, { titleSize: 62, kicker: "多步规划" });
      agentPhone(progress);
    }

    function drawPrivacy(sec, progress) {
      leftNarrative("敏感照护记录，可以更靠近家属。", "隐私模式支持下载 Gemma 端侧模型，用于本地照护理解与建议生成；云端模式则用于更完整的 Agent 工作流与知识库调用。", sec, { titleSize: 58, kicker: "端侧 / 隐私模式", bodySize: 28 });
      privacyPhone(progress);
    }

    function drawToday(sec, progress) {
      leftNarrative("今晚最需要做什么，一眼看到。", "只展示真正值得关注的事项：夜间安全、饮食、用药、照护者压力。", sec, { titleSize: 58, kicker: "今日照护" });
      todayPhone(progress);
    }

    function drawScript(sec) {
      leftNarrative("冲突时，先接住情绪。", "CareMind 不让家属和患者争辩事实，而是给出更低冲突的回应。", sec, { titleSize: 62, kicker: "沟通话术" });
      scriptPhone();
    }

    function drawFollowup(sec) {
      leftNarrative("复诊时，不再只靠回忆。", "近 7 天记录、医生问题、资料清单，会整理成可复制摘要，由家属决定是否分享。", sec, { titleSize: 60, kicker: "复诊准备" });
      followupPhone();
    }

    function drawOutro(sec, progress) {
      const a = ease(progress);
      logo(W / 2 - 44, 255, 1.6);
      text("CareMind", W / 2, 390, { size: 78, weight: 800, color: palette.greenDark, align: "center", alpha: a });
      wrap("把混乱的照护过程，变成可记录、可追踪、可沟通的支持。", W / 2 - 500, 505, 1000, 60, { size: 40, weight: 700, color: palette.ink, alpha: a });
      text("不替代医生，只做你身边的照护记录伙伴。", W / 2, 650, { size: 30, color: palette.secondary, align: "center", alpha: a });
      text("为失智症家庭照护者设计", W / 2, 780, { size: 24, weight: 700, color: palette.clay, align: "center", alpha: a });
    }

    function draw(ms) {
      const sec = ms / 1000;
      background(sec);
      const scene = activeScene(sec);
      const progress = sceneProgress(sec, scene);
      if (scene.id === "premise") drawIntro(sec, progress);
      if (scene.id === "input") drawInput(sec, progress);
      if (scene.id === "agent") drawAgent(sec, progress);
      if (scene.id === "privacy") drawPrivacy(sec, progress);
      if (scene.id === "today") drawToday(sec, progress);
      if (scene.id === "script") drawScript(sec, progress);
      if (scene.id === "followup") drawFollowup(sec, progress);
      if (scene.id === "outro") drawOutro(sec, progress);
    }

    let previewStart = performance.now();
    function preview() {
      const elapsed = (performance.now() - previewStart) % DURATION_MS;
      draw(elapsed);
      requestAnimationFrame(preview);
    }
    preview();

    function createMusicStream(durationMs) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;

      const audio = new AudioContextClass();
      const destination = audio.createMediaStreamDestination();
      const master = audio.createGain();
      master.gain.setValueAtTime(0.0001, audio.currentTime);
      master.gain.exponentialRampToValueAtTime(0.04, audio.currentTime + 1.8);
      master.gain.setValueAtTime(0.04, audio.currentTime + durationMs / 1000 - 2.2);
      master.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + durationMs / 1000);
      master.connect(destination);

      const notes = [261.63, 329.63, 392.0, 493.88, 440.0, 349.23];
      notes.forEach((freq, index) => {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = index % 2 === 0 ? "sine" : "triangle";
        osc.frequency.setValueAtTime(freq / 2, audio.currentTime);
        gain.gain.setValueAtTime(0.012 + index * 0.002, audio.currentTime);
        osc.connect(gain);
        gain.connect(master);
        osc.start(audio.currentTime + index * 0.09);
        osc.stop(audio.currentTime + durationMs / 1000);
      });

      for (let i = 0; i < 12; i += 1) {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        const t = audio.currentTime + 4 + i * 4;
        osc.type = "sine";
        osc.frequency.setValueAtTime(notes[i % notes.length], t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.035, t + 0.2);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
        osc.connect(gain);
        gain.connect(master);
        osc.start(t);
        osc.stop(t + 1.6);
      }

      if (audio.state === "suspended") void audio.resume();
      return { stream: destination.stream, close: () => audio.close() };
    }

    window.renderCareMindVideo = async function renderCareMindVideo(options = {}) {
      const durationMs = Number(options.durationMs || DURATION_MS);
      const fps = Number(options.fps || 24);
      const stream = canvas.captureStream(fps);
      const music = options.music === false ? null : createMusicStream(durationMs);
      if (music) {
        for (const track of music.stream.getAudioTracks()) stream.addTrack(track);
      }
      const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
        ? "video/webm;codecs=vp9"
        : "video/webm";
      const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8000000 });
      const chunks = [];
      recorder.ondataavailable = (event) => {
        if (event.data && event.data.size) chunks.push(event.data);
      };
      recorder.start();
      const totalFrames = Math.ceil((durationMs / 1000) * fps);
      for (let frame = 0; frame <= totalFrames; frame += 1) {
        draw((frame / fps) * 1000);
        await new Promise((resolve) => setTimeout(resolve, 1000 / fps));
      }
      await new Promise((resolve) => {
        recorder.onstop = resolve;
        recorder.stop();
      });
      stream.getTracks().forEach((track) => track.stop());
      if (music) await music.close();
      const blob = new Blob(chunks, { type: "video/webm" });
      return await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(blob);
      });
    };
  </script>
</body>
</html>
